# Navidrome on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=navidrome
PKG_TITLE="Navidrome"
PKG_DESC="Navidrome, your own music streaming server, in Container Manager — playing the music already in your shared folder to the web and to Subsonic apps on every phone, with a DSM window for the library and scans, phone setup with a QR code, users, sharing and HTTPS with DSM's certificate."
APP_ID="Navidrome.AppInstance"
REPO=tombruton87/navidrome-dsm
SERVICES="server"
VOLUMES="data"
IMAGE_VARS="ND_IMAGE"
PORT=4533
PORTS="4533 4534 4540 8096"
HEALTH_PATH=/ping
APP_ACTIONS="useradd|userpw|setadmin|userdel|scan|musicdir|scanevery|sharing|refreshcert"
APP_ANSWER_KEYS="ADMIN_USER MUSIC_DIR_B64 TLS"
APP_REQUEST_KEYS="NUSER USER_ID ROLE FULL MUSIC_DIR_B64 SCAN_EVERY TLS"
TAGLINE="music streaming"
WELCOME="Navidrome turns the music already on your Synology into your own streaming service: a fast web player, and every Subsonic app on Android and iPhone. This package runs it in Container Manager reading your music folder (it never changes your files), makes your account, and adds a Navidrome window to DSM for the library, phones, users and HTTPS."
BACKUP_WHAT="the library database (playlists, favourites, ratings, play counts, users) and Navidrome's settings — not the music itself, which stays where it is in your shared folder."
SITE_NOTE="Phones and the web player reach Navidrome at this address — for listening away from home, it must be reachable from outside (DSM's reverse proxy with a domain, steps below, or HTTPS on this port with a trusted certificate). HTTPS can be served directly with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals picked up daily) or a self-signed one — most phone apps need a trusted one."
ICON_TOP="#1f2a3a"
ICON_BOTTOM="#0b1220"
ICON_LETTER="N"   # only if icon.png is missing
BETA=yes
